<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carlos · Cumple a 4</title>
  <meta name="description" content="La página de cumpleaños de Carlos.">
  <meta name="theme-color" content="#6fe0a0">
  <meta property="og:title" content="Feliz cumpleaños, Carlos">
  <meta property="og:description" content="Una página de cumpleaños hecha para Carlos.">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Feliz cumpleaños, Carlos">
  <meta name="twitter:description" content="Una página de cumpleaños hecha para Carlos.">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/persona.css">
</head>
<body class="person-page" data-person-id="carlos" data-asset-prefix="../">
  <div class="party-bg" id="party-bg" aria-hidden="true"></div>
  <header class="person-hero">
    <a class="back-link" href="../index.html">← Volver a la tarta</a>
    <span class="person-eyebrow">Feliz cumpleaños para</span>
    <h1 id="person-name">Carlos</h1>
    <p>Una página solo para ti, con tu canción y tu cómic.</p>
  </header>
  <main class="person-main">
    <section class="person-card" aria-labelledby="dedication-title">
      <div class="birthday-mark" aria-hidden="true">🎂🕯️</div>
      <h2 id="dedication-title">Hoy celebramos a <span id="dedication-name">Carlos</span></h2>
      <p>Sopla tu vela, pide un deseo y disfruta de tu rincón de la fiesta.</p>
      <div class="person-actions">
        <button class="primary-button" id="play-song" type="button">▶ Escuchar tu canción</button>
        <a class="secondary-button" href="../index.html">Ver la tarta completa</a>
      </div>
    </section>
    <section class="person-card person-comic" aria-labelledby="comic-title">
      <h2 id="comic-title">El cómic de <span id="comic-name">Carlos</span></h2>
      <p>Tu historia especial de cumpleaños.</p>
      <div class="personal-gallery" id="personal-gallery"></div>
    </section>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="../js/config.js"></script>
  <script src="../js/persona.js"></script>
</body>
</html>
